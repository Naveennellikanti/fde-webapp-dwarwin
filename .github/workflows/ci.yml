name: CI

# Everything here runs without an API key. The pipeline is driven by a scripted mock
# provider, so correctness of the parts we control — guardrails, retries, joins, chart
# selection, validation — is checked on every push. Model accuracy needs a real model
# and is run manually (see evals/README-ish notes in run_eval.py).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend tests + eval gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Pipeline tests
        run: python tests/test_pipeline.py

      - name: Session-key security tests
        run: python tests/test_session_key.py

      - name: Validation and ambiguity tests
        run: python tests/test_validation.py

      - name: Investigation tests
        run: python tests/test_investigator.py

      - name: Cleaning tests
        run: python tests/test_cleaning.py

      # The gate that matters: SQL accuracy over a labelled set, asserted against
      # values computed in pandas. A prompt change that breaks a join shows up here as
      # a number rather than as a surprise in a demo.
      - name: Eval suite
        run: python evals/run_eval.py --mock --min-accuracy 1.0 --json eval-results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval-results.json

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
