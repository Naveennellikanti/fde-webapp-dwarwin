services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Local-first: talk to the ollama service below. Falls back to Groq if you
      # set GROQ_API_KEY and Ollama is not reachable.
      LLM_BACKEND: ${LLM_BACKEND:-auto}
      OLLAMA_URL: http://ollama:11434
      # 3b is the better default on a CPU-only machine; 7b is more accurate on
      # tricky joins but several times slower without a GPU.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CORS_ORIGINS: http://localhost:3000
      # Privacy: set SCHEMA_ONLY=true to send column names/types only (no sample values).
      SCHEMA_ONLY: ${SCHEMA_ONLY:-false}
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  # Local open-source model runtime. Data never leaves this machine.
  # This is a container-local Ollama reached over the compose network, so it is
  # independent of any Ollama installed on the host (which binds to 127.0.0.1 only
  # and would not be reachable from inside the backend container).
  # After first start, pull the model:
  #   docker compose exec ollama ollama pull qwen2.5-coder:3b
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
